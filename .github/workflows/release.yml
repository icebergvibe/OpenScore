name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: even though this is a private repo where only collaborators
    # with write access can trigger workflows at all, refuse to run for anyone but
    # icebergvibe specifically.
    if: github.actor == 'icebergvibe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/signing/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/signing/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        env:
          OPENSCORE_KEYSTORE_PROPERTIES: ${{ format('{0}/signing/keystore.properties', runner.temp) }}
        run: ./gradlew :apps:android:assembleRelease --no-daemon

      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openscore-release-apk
          path: apps/android/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/build/outputs/apk/release/*.apk
