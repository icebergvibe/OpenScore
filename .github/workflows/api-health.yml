# Weekly check that every documented league endpoint still answers and still looks like its
# captured sample (tools/api-health). Read-only, ~500 polite GET requests spread over ~8 minutes.
name: API health

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated league ids to check (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: api-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The tool itself is JVM-only, but configuring the build configures the Android modules
      # too, and they compile against platforms the runner image does not necessarily ship.
      # Platform packages carry a minor version since Android 16 ("android-37.0", not "android-37").
      - name: Android SDK platforms
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "platforms;android-37.0" > /dev/null

      - name: Run api-health
        id: health
        continue-on-error: true
        env:
          LEAGUES: ${{ github.event.inputs.leagues }}
        run: |
          ARGS="--markdown build/health/report.md --json build/health/report.json"
          if [ -n "$LEAGUES" ]; then ARGS="$ARGS --league $LEAGUES"; fi
          ./gradlew --no-daemon -q :tools:api-health:run --args="$ARGS"

      - name: Publish summary
        if: always()
        run: |
          if [ -f build/health/report.md ]; then
            cat build/health/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::api-health produced no report — the build or the tool failed before any check ran; see the step log."
            echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-health-report
          path: build/health/
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail the job if any endpoint is broken
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::At least one documented endpoint is broken — see the job summary. Mark it '⚠️ broken since <date>' in the league README and open an issue (docs/principles.md)."
          exit 1
